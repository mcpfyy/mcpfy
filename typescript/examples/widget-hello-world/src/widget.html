<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 14px system-ui, sans-serif; margin: 0; padding: 16px; }
      button { margin-top: 8px; }
    </style>
  </head>
  <body>
    <h3>Counter widget</h3>
    <p id="count">count: -</p>
    <button id="increment">+1 (via tool call)</button>

    <script type="module">
      // Self-contained — no bundler, no import of mcpfy/widget-bridge, so this file
      // works dropped into any host as-is. A real widget built with a bundler would
      // instead `import { connect, postToolCall } from "mcpfy/widget-bridge"` and get
      // the same behavior with a proper MCP Apps JSON-RPC handshake instead of the
      // best-effort detection below.

      const countEl = document.getElementById("count");
      const openai = window.openai; // present only inside a ChatGPT/Apps SDK host

      function render(data) {
        countEl.textContent = `count: ${data?.count ?? 0}`;
      }

      if (openai) {
        // Apps SDK: initial data is already on window.openai.toolOutput.
        render(openai.toolOutput);
      } else if (window !== window.parent) {
        // MCP Apps / MCP-UI: listen for the host pushing tool-result data. MCP Apps
        // sends a JSON-RPC notification; MCP-UI's own handshake varies by host, so
        // this listens broadly rather than assuming one exact message shape.
        window.addEventListener("message", (event) => {
          const msg = event.data;
          if (msg?.method === "ui/notifications/tool-result") {
            render(msg.params?.structuredContent);
          }
        });
      }

      document.getElementById("increment").addEventListener("click", () => {
        if (openai?.callTool) {
          openai.callTool("increment-counter", {}).then((r) => render(r.structuredContent));
        } else if (window !== window.parent) {
          // MCP-UI action message — see mcpfy/widget-bridge's postToolCall() for the
          // typed version of this same postMessage.
          window.parent.postMessage({ type: "tool", payload: { toolName: "increment-counter", params: {} } }, "*");
        }
      });
    </script>
  </body>
</html>
